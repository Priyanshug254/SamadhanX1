services:
  postgres:
    image: postgres:16-alpine
    container_name: samadhanx-postgres
    restart: always
    environment:
      POSTGRES_DB: samadhanx_db
      POSTGRES_USER: samadhanx
      POSTGRES_PASSWORD: samadhanx_secure_local_dev_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
