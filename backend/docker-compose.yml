version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: samadhanx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-samadhanx_db}
      POSTGRES_USER: ${DB_USERNAME:-samadhanx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-samadhanx_secure_local_dev_pass_2026}
    ports:
      -"5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-samadhanx} -d ${DB_NAME:-samadhanx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
